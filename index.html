<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vinni ❤️ Akki</title>
  <style>
    body {
     background: url("https://images.unsplash.com/photo-1500648767791-00dcc994a43e");
      font-family: 'Georgia', serif;
      text-align: center;
      padding-top: 120px;
      color: white;
      overflow: hidden;
    }

    /* 👉 Replace the photo link above with your own photo URL */

    .overlay {
      background: rgba(0,0,0,0.5);
      position: fixed;
      top:0; left:0; right:0; bottom:0;
      z-index: -1;
    }

    h1 { font-size: 3.2em; }
    h2 { font-size: 2em; margin-bottom: 30px; }

    button {
      padding: 15px 35px;
      font-size: 20px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      margin: 20px;
    }

    #yes {
      background-color: #ff0033;
      color: white;
      box-shadow: 0 0 15px pink;
    }

    #no {
      background-color: #444;
      color: white;
      position: absolute;
    }

    .heart {
      position: fixed;
      top: -10px;
      font-size: 24px;
      animation: fall linear infinite;
    }

    @keyframes fall {
      to { transform: translateY(110vh); }
    }

    .firework {
      position: fixed;
      width: 8px;
      height: 8px;
      background: gold;
      border-radius: 50%;
      animation: explode 1s ease-out forwards;
    }

    @keyframes explode {
      from { transform: scale(1); opacity: 1; }
      to { transform: scale(20); opacity: 0; }
    }
  </style>
</head>
<body>
<div class="overlay"></div>

<h1>Akki 💖</h1>
<h2>Will you go on a date with me Baby?</h2>
<p>— Love, Vinni 💕</p>

<button id="yes" onclick="yesClicked()">YES 😍</button>
<button id="no" onmouseover="moveButton()">NO 🙈</button>

<script>
  function yesClicked() {
    fireworks();
    document.body.innerHTML = `
      <h1>YAYYYY 🥰</h1>
      <h2>It's a date, Akki 💕</h2>
      <p>Can't wait to see you ❤️</p>
    `;
  }

  function moveButton() {
    var x = Math.random() * (window.innerWidth - 120);
    var y = Math.random() * (window.innerHeight - 60);
    document.getElementById("no").style.left = x + "px";
    document.getElementById("no").style.top = y + "px";
  }

  function createHeart() {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (3 + Math.random() * 5) + "s";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 8000);
  }
  setInterval(createHeart, 400);

  function fireworks() {
    for (let i = 0; i < 40; i++) {
      const fw = document.createElement("div");
      fw.classList.add("firework");
      fw.style.left = Math.random() * 100 + "vw";
      fw.style.top = Math.random() * 100 + "vh";
      document.body.appendChild(fw);
      setTimeout(() => fw.remove(), 1000);
    }
  }
</script>

</body>
</html>
