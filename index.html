<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vinni ❤️ Mani</title>

  <style>
    /* -------------------- BACKGROUND -------------------- */
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background: url("https://images.pexels.com/photos/3651820/pexels-photo-3651820.jpeg") no-repeat center center/cover;
      font-family: "Georgia", serif;
      color: white;
      text-align: center;
      overflow: hidden;
    }

    /* Dark overlay for readability */
    .overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(2px);
      z-index: -1;
    }

    /* -------------------- TEXT -------------------- */
    h1 {
      font-size: 3.2em;
      text-shadow: 0 0 10px rgba(255,255,255,0.8);
      margin-top: 120px;
    }

    h2 {
      font-size: 2em;
      margin-bottom: 20px;
      text-shadow: 0 0 10px rgba(255,255,255,0.7);
    }

    p {
      font-size: 1.3em;
      margin-bottom: 40px;
      color: #ffe6f2;
    }

    /* -------------------- BUTTONS -------------------- */
    button {
      padding: 15px 35px;
      font-size: 22px;
      border: none;
      border-radius: 40px;
      cursor: pointer;
      margin: 20px;
      transition: 0.3s;
    }

    #yes {
      background-color: #ff3366;
      box-shadow: 0 0 15px #ff99bb;
      color: white;
    }
    #yes:hover {
      transform: scale(1.1);
      background-color: #ff204d;
    }

    #no {
      background-color: rgba(255,255,255,0.2);
      color: white;
      position: absolute;
      border: 1px solid white;
    }

    /* -------------------- HEART FALL ANIMATION -------------------- */
    .heart {
      position: fixed;
      top: -10px;
      font-size: 24px;
      animation: fall linear infinite;
    }

    @keyframes fall {
      to {
        transform: translateY(110vh);
        opacity: 0.7;
      }
    }

    /* -------------------- FIREWORKS -------------------- */
    .firework {
      position: fixed;
      width: 8px;
      height: 8px;
      background: gold;
      border-radius: 50%;
      animation: explode 1s ease-out forwards;
    }

    @keyframes explode {
      from { transform: scale(1); opacity: 1; }
      to { transform: scale(20); opacity: 0; }
    }

  </style>
</head>

<body>

<div class="overlay"></div>

<h1>Mani 💖</h1>
<h2>Will you go on a date with me Baby?</h2>
<p>— Love, Vinni 💕</p>

<button id="yes" onclick="yesClicked()">YES 😍</button>
<button id="no" onmouseover="moveButton()">NO 🙈</button>

<script>
  function yesClicked() {
    fireworks();
    document.body.innerHTML = `
      <div class="overlay"></div>
      <h1>YAYYYY 🥰</h1>
      <h2>It's a date, Mani 💕</h2>
      <p>Can't wait to see you ❤️</p>
    `;
  }

  function moveButton() {
    let x = Math.random() * (window.innerWidth - 120);
    let y = Math.random() * (window.innerHeight - 60);
    document.getElementById("no").style.left = x + "px";
    document.getElementById("no").style.top = y + "px";
  }

  function createHeart() {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (3 + Math.random() * 5) + "s";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 8000);
  }
  setInterval(createHeart, 350);

  function fireworks() {
    for (let i = 0; i < 40; i++) {
      const fw = document.createElement("div");
      fw.classList.add("firework");
      fw.style.left = Math.random() * 100 + "vw";
      fw.style.top = Math.random() * 100 + "vh";
      document.body.appendChild(fw);
      setTimeout(() => fw.remove(), 1000);
    }
  }
</script>

</body>
</html>
